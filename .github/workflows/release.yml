name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build, test, attach artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify the tag matches the project version (release runs only)
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match project version $VERSION"
            exit 1
          fi

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Attach JARs to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            paylink-core/target/paylink-core-*.jar \
            paylink-spring-boot-starter/target/paylink-spring-boot-starter-*.jar \
            --clobber
